services:
  server-room-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-room-app
    ports:
      - "${APP_PORT:-4321}:4321"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4321
      - DB_PATH=/app/data/app.db
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - server-room-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:

networks:
  server-room-network:
    driver: bridge
